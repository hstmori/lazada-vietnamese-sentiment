name: quality-checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Validate saved notebook
        run: python scripts/validate_notebook.py



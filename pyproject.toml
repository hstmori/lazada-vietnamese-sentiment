[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazada-vietnamese-sentiment"
version = "0.1.0"
description = "A reproducible Vietnamese sentiment analysis baseline for Lazada review text."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ipython>=8.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
    "nbformat>=5.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "seaborn>=0.12",
    "underthesea>=6.8",
    "wordcloud>=1.9",
]

[project.optional-dependencies]
dev = [
    "nbclient>=0.8",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]


